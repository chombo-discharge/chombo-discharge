# ----------------------------------------------------------------------------------------------------
# Superparticle-merge conservation tests. Each runs the BrownianWalker app with a different
# ItoSolver.merge_method and BrownianWalker.verify_conservation=true, which aborts (tanks the
# test) if a merge fails to conserve the total particle weight.
# ----------------------------------------------------------------------------------------------------

[BrownianWalker/NNAmrTree2d]
  directory     = BrownianWalker/NNAmrTree
  dim           = 2
  exec          = main
  input         = regression2d.inputs
  output        = NNAmrTree2d
  benchmark     = NNAmrTree2d_benchmark
  nsteps        = 10
  plot_interval = 5
  restart       = -1

