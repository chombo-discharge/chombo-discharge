# ----------------------------------------------------------------------------------------------------
# Superparticle-merge conservation tests. Each runs the BrownianWalker app with a different
# ItoSolver.merge_algorithm and BrownianWalker.verify_conservation=true, which aborts (tanks the
# test) if a merge fails to conserve the total particle weight.
# ----------------------------------------------------------------------------------------------------

[BrownianWalker/NNMerge2d]
  directory     = BrownianWalker/NNMerge
  dim           = 2
  exec          = main
  input         = regression2d.inputs
  output        = NNMerge2d
  benchmark     = NNMerge2d_benchmark
  nsteps        = 10
  plot_interval = 5
  restart       = -1

